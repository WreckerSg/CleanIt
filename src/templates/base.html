{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CleanIt{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/cleanit.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'dashboard' %}" aria-label="Ir al inicio de CleanIt">
            <span class="brand-mark" aria-hidden="true">✓</span>
            <span>CleanIt</span>
        </a>

        {% if user.is_authenticated %}
            <div class="session">
                <span>{{ user.get_full_name|default:user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="button button-secondary" type="submit">Cerrar sesión</button>
                </form>
            </div>
        {% endif %}
    </header>

    <main class="page-shell">
        {% if messages %}
            <div class="messages" aria-live="polite">
                {% for message in messages %}<p>{{ message }}</p>{% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
